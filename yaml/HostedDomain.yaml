openapi: 3.0.3
info:
  title: IP2WHOIS Hosted Domain API
  description: |-
    IP2WHOIS Hosted Domain API returns the domain names hosted on an IP address, in real time, for IPv4 and IPv6.

    **Authentication.** Send your API key as a Bearer token in the `Authorization` header (recommended), or as the `key` query parameter. Without a key, the IP geolocation endpoint allows 1,000 requests per day from the same client IP. This endpoint requires an API key.

    **Pagination.** Results are returned 100 domains at a time on the Security plan (1 on Free, 5 on Starter, 20 on Plus). Read `total_pages` from the first response and request each `page` in turn until every page has been read.

    The endpoint supports JSON and XML responses.
  version: '1'
  termsOfService: https://www.ip2location.io/terms-of-service
  contact:
    name: IP2Location.io
    url: https://www.ip2location.io
    email: support@ip2location.io
  license:
    name: MIT
    url: https://github.com/ip2location/ip2location-io-openapi/blob/main/LICENSE
servers:
  - url: https://domains.ip2whois.com/domains
    description: Hosted Domain endpoint.
tags:
  - name: Hosted Domain
    description: List the domain names hosted on an IP address.
paths:
  /:
    get:
      tags:
        - Hosted Domain
      summary: List domains hosted on an IP address
      description: Returns one page of domain names hosted on the address. Use `page` to walk the result set until `total_pages` is reached.
      operationId: hostedDomain
      externalDocs:
        description: Hosted Domain API documentation
        url: https://www.ip2location.io/ip2whois-domains-documentation
      parameters:
        - $ref: '#/components/parameters/key_required'
        - $ref: '#/components/parameters/ip_required'
        - $ref: '#/components/parameters/format_json_xml'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: One page of hosted domains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedDomainResponse'
              examples:
                Hosted Domain:
                  value:
                    ip: 8.8.8.8
                    total_domains: 3857
                    page: 1
                    per_page: 100
                    total_pages: 39
                    domains:
                      - 000180.top
                      - 00100tet.xyz
                      - 001hash.vip
            application/xml:
              schema:
                type: string
              example: |-
                <result>
                  <ip>8.8.8.8</ip>
                  <total_domains>3857</total_domains>
                  <page>1</page>
                  <per_page>100</per_page>
                  <total_pages>39</total_pages>
                  <domains>
                    <item>000180.top</item>
                    <item>00100tet.xyz</item>
                    <item>001hash.vip</item>
                  </domains>
                </result>
        '400':
          description: Missing parameter, invalid IP address, invalid format, or invalid page value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Missing parameter:
                  value:
                    error:
                      error_code: 10000
                      error_message: Missing parameter.
                Invalid IP address:
                  value:
                    error:
                      error_code: 10006
                      error_message: Invalid IP address.
                Invalid format:
                  value:
                    error:
                      error_code: 10007
                      error_message: Invalid format.
                Invalid page value:
                  value:
                    error:
                      error_code: 10008
                      error_message: Invalid page value.
        '401':
          description: API key not found, disabled, expired, or out of queries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                API key not found:
                  value:
                    error:
                      error_code: 10001
                      error_message: API key not found.
                API key disabled:
                  value:
                    error:
                      error_code: 10002
                      error_message: API key disabled.
                API key expired:
                  value:
                    error:
                      error_code: 10003
                      error_message: API key expired.
                Insufficient queries:
                  value:
                    error:
                      error_code: 10004
                      error_message: Insufficient queries.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Internal server error:
                  value:
                    error:
                      error_code: 10005
                      error_message: Internal server error.
      security:
        - bearerAuth: []
        - apiKey: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API key sent as `Authorization: Bearer {YOUR_API_KEY}`. This is the recommended method because it keeps the key out of URLs, logs and browser history.'
    apiKey:
      type: apiKey
      in: query
      name: key
      description: API key sent as the `key` query parameter. Supported as an alternative to the Bearer token, but less secure because the key appears in the URL.
  parameters:
    key_required:
      name: key
      in: query
      required: true
      schema:
        type: string
      description: 'API key. Required unless the `Authorization: Bearer` header is sent. Get a free key at https://www.ip2location.io/sign-up.'
    ip_required:
      name: ip
      in: query
      required: true
      schema:
        type: string
        format: ip
        example: 8.8.8.8
      description: IPv4 or IPv6 address to look up.
    format_json_xml:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum:
          - json
          - xml
        default: json
      description: Response format. Defaults to `json`.
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
      description: Page of hosted domains to return. Increment it until `total_pages` is reached. Defaults to the first page.
  schemas:
    ErrorResponse:
      type: object
      description: Error envelope returned for every failed request.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - error_code
            - error_message
          properties:
            error_code:
              type: integer
              description: Numeric error code, unique within the API.
              example: 10001
            error_message:
              type: string
              description: Human-readable error message.
              example: Invalid IP address.
    HostedDomainResponse:
      type: object
      description: One page of domain names hosted on the requested address.
      required:
        - ip
        - domains
      properties:
        ip:
          type: string
          format: ip
          description: IP address that was looked up.
          example: 8.8.8.8
        total_domains:
          type: integer
          description: Total number of hosted domains found for the address.
          example: 3857
        page:
          type: integer
          minimum: 1
          description: Current page number.
          example: 1
        per_page:
          type: integer
          description: 'Number of domains returned per page. Free: 1, Starter: 5, Plus: 20, Security: 100.'
          example: 100
        total_pages:
          type: integer
          description: Total number of pages for the address.
          example: 39
        domains:
          type: array
          description: Domain names hosted on the address, one page at a time.
          items:
            type: string
            example: 000180.top
          example:
            - 000180.top
            - 00100tet.xyz
            - 001hash.vip
