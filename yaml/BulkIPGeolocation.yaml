                      asn: '13335'
                      as: CloudFlare Inc
                      as_info:
                        as_number: '13335'
                        as_name: CloudFlare Inc
                        as_domain: cloudflare.com
                        as_usage_type: CDN
                        as_cidr: 1.1.1.0/24
                      isp: APNIC and CloudFlare DNS Resolver Project
                      domain: cloudflare.com
                      net_speed: T1
                      idd_code: '61'
                      area_code: '07'
                      weather_station_code: ASXX0016
                      weather_station_name: Brisbane
                      mcc: null
                      mnc: null
                      mobile_brand: null
                      elevation: 16
                      usage_type: CDN
                      address_type: Anycast
