                      is_proxy: false
            text/csv:
              schema:
                type: string
              example: |-
                ip_address,country_code,country_name,region_name,city_name,latitude,longitude,zip_code,time_zone,asn,as,as_info.as_name,as_info.as_number,as_info.as_domain,as_info.as_cidr,as_info.as_usage_type,isp,domain,net_speed,idd_code,area_code,weather_station_code,weather_station_name,mcc,mnc,mobile_brand,elevation,usage_type,address_type,ads_category,ads_category_name,district,continent.name,continent.code,continent.hemisphere,continent.translation,country.name,country.alpha3_code,country.numeric_code,country.demonym,country.flag,country.capital,country.total_area,country.population,country.currency,country.language,country.tld,country.translation,region.name,region.code,region.translation,city.name,city.translation,time_zone_info.olson,time_zone_info.current_time,time_zone_info.gmt_offset,time_zone_info.is_dst,time_zone_info.abbreviation,time_zone_info.dst_start_date,time_zone_info.dst_end_date,time_zone_info.sunrise,time_zone_info.sunset,geotargeting.metro,is_proxy,fraud_score,proxy.last_seen,proxy.proxy_type,proxy.threat,proxy.provider,proxy.is_vpn,proxy.is_tor,proxy.is_data_center,proxy.is_public_proxy,proxy.is_web_proxy,proxy.is_web_crawler,proxy.is_ai_crawler,proxy.is_residential_proxy,proxy.is_spammer,proxy.is_scanner,proxy.is_botnet,proxy.is_bogon,proxy.is_consumer_privacy_network,proxy.is_enterprise_private_network
                1.1.1.1,AU,Australia,Queensland,Brisbane,-27.46754,153.02809,4000,+10:00,13335,"CloudFlare Inc","APNIC and CloudFlare DNS Resolver Project",cloudflare.com,T1,61,07,ASXX0016,Brisbane,,,,16,CDN,A,Oceania,OC,south,east,en,Oceania,Australia,AUS,36,Australians,https://cdn.ip2location.io/assets/img/flags/au.png,Canberra,7741220,26461166,AUD,"Australian Dollar",$,EN,English,au,en,Australia,Queensland,AU-QLD,en,Queensland,Brisbane,en,Brisbane,Australia/Brisbane,2026-02-24T11:34:09+10:00,36000,,AEST,,,05:36,18:26,,,0,1,DCH,,,,,1,,,,,,,,,,,
        '401':
          description: Invalid API key or insufficient credit. This endpoint requires a paid plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid API key:
                  value:
                    error:
                      error_code: 401
                      error_message: Invalid API key or insufficient credit.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Internal server error:
                  value:
                    error:
                      error_code: 500
                      error_message: Internal server error.
      security:
        - bearerAuth: []
        - apiKey: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API key sent as `Authorization: Bearer {YOUR_API_KEY}`. This is the recommended method because it keeps the key out of URLs, logs and browser history.'
    apiKey:
      type: apiKey
      in: query
      name: key
      description: API key sent as the `key` query parameter. Supported as an alternative to the Bearer token, but less secure because the key appears in the URL.
  parameters:
    key_required:
      name: key
      in: query
      required: true
      schema:
        type: string
      description: 'API key. Required unless the `Authorization: Bearer` header is sent. Get a free key at https://www.ip2location.io/sign-up.'
    format_json_csv:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum:
          - json
          - csv
        default: json
      description: Response format. Defaults to `json`.
    fields:
      name: fields
      in: query
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - country_code
            - country_name
            - region_name
            - city_name
            - latitude
            - longitude
            - zip_code
            - time_zone
            - asn
            - as
            - as_info.as_name
            - as_info.as_number
            - as_info.as_domain
            - as_info.as_cidr
            - as_info.as_usage_type
            - isp
            - domain
            - net_speed
            - idd_code
            - area_code
            - weather_station_code
            - weather_station_name
            - mcc
            - mnc
            - mobile_brand
            - elevation
            - usage_type
            - address_type
            - ads_category
            - ads_category_name
            - district
            - continent.name
            - continent.code
            - continent.hemisphere
            - continent.translation
            - country.name
            - country.alpha3_code
            - country.numeric_code
            - country.demonym
            - country.flag
            - country.capital
            - country.total_area
            - country.population
            - country.currency
            - country.language
            - country.tld
            - country.translation
            - region.name
            - region.code
            - region.translation
            - city.name
            - city.translation
            - time_zone_info.olson
            - time_zone_info.current_time
            - time_zone_info.gmt_offset
            - time_zone_info.is_dst
            - time_zone_info.abbreviation
            - time_zone_info.dst_start_date
            - time_zone_info.dst_end_date
            - time_zone_info.sunrise
            - time_zone_info.sunset
            - geotargeting.metro
            - is_proxy
            - fraud_score
            - proxy.last_seen
            - proxy.proxy_type
            - proxy.threat
            - proxy.provider
            - proxy.is_vpn
            - proxy.is_tor
            - proxy.is_data_center
            - proxy.is_public_proxy
            - proxy.is_web_proxy
            - proxy.is_web_crawler
            - proxy.is_ai_crawler
            - proxy.is_residential_proxy
            - proxy.is_spammer
            - proxy.is_scanner
            - proxy.is_botnet
            - proxy.is_bogon
            - proxy.is_consumer_privacy_network
            - proxy.is_enterprise_private_network
        examples:
          - - country_code
            - country_name
            - city_name
            - is_proxy
      description: Comma-separated list of fields to return. When omitted, all fields are returned.
  schemas:
    ASInfo:
      type: object
      description: Autonomous System details. Available on the Security plan.
      properties:
        as_number:
          type: string
          description: Autonomous system number (ASN).
          examples:
            - '15169'
        as_name:
          type: string
          description: Autonomous system (AS) name.
          examples:
            - Google LLC
        as_domain:
          type: string
          description: Domain name of the AS registrant.
          examples:
            - google.com
        as_usage_type:
          type: string
          enum:
            - COM
            - ORG
            - GOV
            - MIL
            - EDU
            - LIB
            - CDN
            - ISP
            - MOB
            - DCH
            - SES
            - AIC
            - RSV
            - ISP/MOB
          description: Usage type of the AS registrant.
          examples:
            - DCH
        as_cidr:
          type: string
          description: CIDR range for the whole AS.
          examples:
            - 8.8.8.0/24
    Continent:
      type: object
      description: Continent details. Available on the Plus and Security plans.
      properties:
        name:
          type: string
          description: Continent name.
          examples:
            - North America
        code:
          type: string
          enum:
            - AF
            - AN
            - AS
            - EU
            - NA
            - OC
            - SA
          description: Two-character continent code.
          examples:
            - NA
        hemisphere:
          type: array
          description: The hemisphere where the country is located. The first item is the north/south hemisphere and the second item is the east/west hemisphere.
          items:
            type: string
            enum:
              - north
              - south
              - east
              - west
          examples:
            - - north
              - west
        translation:
          type: object
          description: Translation of the name for the language requested with the `lang` parameter. Both values are null when no translation is available, for example for city names.
          properties:
            lang:
              type:
                - string
                - 'null'
              examples:
                - ko
            value:
              type:
                - string
                - 'null'
              examples:
                - 북아메리카
    Country:
      type: object
      description: Country details. Available on the Plus and Security plans.
      properties:
        name:
          type: string
          description: Country name based on ISO 3166.
          examples:
            - United States of America
        alpha3_code:
          type: string
          description: Three-character country code based on ISO 3166.
          examples:
            - USA
        numeric_code:
          type: integer
          description: ISO 3166-1 numeric country code.
          examples:
            - 840
        demonym:
          type: string
          description: Native of the country.
          examples:
            - Americans
        flag:
          type: string
          format: uri
          description: URL of the country flag image.
          examples:
            - https://cdn.ip2location.io/assets/img/flags/us.png
        capital:
          type: string
          description: Capital of the country.
          examples:
            - Washington, D.C.
        total_area:
          type: number
          description: Total area in square kilometres.
          examples:
            - 9826675
        population:
          type: integer
          description: Population of the country.
          examples:
            - 339665118
        currency:
          type: object
          description: Currency of the country.
          properties:
            code:
              type: string
              description: ISO 4217 currency code.
              examples:
                - USD
            name:
              type: string
              description: Currency name.
              examples:
                - United States Dollar
            symbol:
              type: string
              description: Currency symbol.
              examples:
                - $
        language:
          type: object
          description: Primary language of the country.
          properties:
            code:
              type: string
              description: Language code.
              examples:
                - EN
            name:
              type: string
              description: Language name.
              examples:
                - English
        tld:
          type: string
          description: Country-code top-level domain.
          examples:
            - us
        translation:
          type: object
          description: Translation of the name for the language requested with the `lang` parameter. Both values are null when no translation is available, for example for city names.
          properties:
            lang:
              type:
                - string
                - 'null'
              examples:
                - ko
            value:
              type:
                - string
                - 'null'
              examples:
                - 북아메리카
    Region:
      type: object
      description: Region details. Available on the Plus and Security plans.
      properties:
        name:
          type: string
          description: Region or state name.
          examples:
            - California
        code:
          type: string
          description: ISO 3166-2 code.
          examples:
            - US-CA
        translation:
          type: object
          description: Translation of the name for the language requested with the `lang` parameter. Both values are null when no translation is available, for example for city names.
          properties:
            lang:
              type:
                - string
                - 'null'
              examples:
                - ko
            value:
              type:
                - string
                - 'null'
              examples:
                - 북아메리카
    City:
      type: object
      description: City details. Available on the Plus and Security plans.
      properties:
        name:
          type: string
          description: City name.
          examples:
            - Mountain View
        translation:
          type: object
          description: Translation of the name for the language requested with the `lang` parameter. Both values are null when no translation is available, for example for city names.
          properties:
            lang:
              type:
                - string
                - 'null'
              examples:
                - ko
            value:
              type:
                - string
                - 'null'
              examples:
                - 북아메리카
    TimeZoneInfo:
      type: object
      description: Detailed time zone information. Available on the Plus and Security plans.
      properties:
        olson:
          type: string
          description: Time zone in Olson format.
          examples:
            - America/Los_Angeles
        current_time:
          type: string
          format: date-time
          description: Current local time in ISO 8601 format.
          examples:
            - '2025-07-16T19:06:49-07:00'
        gmt_offset:
          type: integer
          description: GMT offset in seconds.
          examples:
            - -25200
        is_dst:
          type: boolean
          description: Whether the time zone is currently observing daylight saving time.
          examples:
            - true
        abbreviation:
          type: string
          description: Time zone abbreviation, for example EST or PDT.
          examples:
            - PDT
        dst_start_date:
          type:
            - string
            - 'null'
          format: date
          description: Date on which daylight saving time starts, or null in a time zone without DST.
          examples:
            - '2025-03-09'
        dst_end_date:
          type:
            - string
            - 'null'
          format: date
          description: Date on which daylight saving time ends, or null in a time zone without DST.
          examples:
            - '2025-11-02'
        sunrise:
          type: string
          description: Sunrise time in local time (hh:mm).
          examples:
            - 06:00
        sunset:
          type: string
          description: Sunset time in local time (hh:mm).
          examples:
            - '20:29'
    Geotargeting:
      type: object
      description: Geotargeting data. Available on the Plus and Security plans.
      properties:
        metro:
          type:
            - string
            - 'null'
          description: Metro code based on the ZIP or postal code, or null when the address is outside a metered area.
          examples:
            - '807'
    Proxy:
      type: object
      description: Proxy and threat details. The full object is available on the Security plan; lower plans only return `is_proxy`.
      properties:
        last_seen:
          type: integer
          description: Number of days since the proxy was last seen.
          examples:
            - 13
        proxy_type:
          type: string
          enum:
            - VPN
            - TOR
            - DCH
            - PUB
            - WEB
            - SES
            - AIC
            - RES
            - CPN
            - EPN
          description: Type of proxy.
          examples:
            - DCH
        threat:
          type: string
          enum:
            - SPAM
            - SCANNER
            - BOTNET
            - BOGON
            - '-'
          description: Security threat reported for the address.
          examples:
            - '-'
        provider:
          type: string
          description: Name of the VPN provider, when available.
          examples:
            - '-'
        is_vpn:
          type: boolean
          description: Anonymising VPN service.
          examples:
            - false
        is_tor:
          type: boolean
          description: Tor exit node.
          examples:
            - false
        is_data_center:
          type: boolean
          description: Hosting provider, data centre or content delivery network.
          examples:
            - true
        is_public_proxy:
          type: boolean
          description: Public proxy.
          examples:
            - false
        is_web_proxy:
          type: boolean
          description: Web proxy.
          examples:
            - false
        is_web_crawler:
          type: boolean
          description: Search engine robot.
          examples:
            - false
        is_ai_crawler:
          type: boolean
          description: Crawler operated by an AI company to collect training data or support retrieval.
          examples:
            - false
        is_residential_proxy:
          type: boolean
          description: Residential proxy.
          examples:
            - false
        is_spammer:
          type: boolean
          description: Email or forum spammer.
          examples:
            - false
        is_scanner:
          type: boolean
          description: Network security scanner.
          examples:
            - false
        is_botnet:
          type: boolean
          description: Malware-infected device.
          examples:
            - false
        is_bogon:
          type: boolean
          description: Unassigned or illegitimate address announced via BGP.
          examples:
            - false
        is_consumer_privacy_network:
          type: boolean
          description: Consumer privacy network.
          examples:
            - false
        is_enterprise_private_network:
          type: boolean
          description: Enterprise private network.
          examples:
            - false
    ErrorResponse:
      type: object
      description: Error envelope returned for every failed request.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - error_code
            - error_message
          properties:
            error_code:
              type: integer
              description: Numeric error code, unique within the API.
              examples:
                - 10001
            error_message:
              type: string
              description: Human-readable error message.
              examples:
                - Invalid IP address.
    BulkIPGeolocationResponse:
      type: object
      description: Map of IP address to geolocation record. Each key is a submitted address; the value contains the fields available on your plan.
      additionalProperties:
        $ref: '#/components/schemas/BulkIPGeolocationRecord'
    BulkIPGeolocationRecord:
      type: object
      description: Geolocation record for one of the submitted addresses.
      properties:
        country_code:
          type: string
          description: Two-character country code based on ISO 3166.
          examples:
            - US
        country_name:
          type: string
          description: Country name based on ISO 3166.
          examples:
            - United States of America
        region_name:
          type: string
          description: Region or state name.
          examples:
            - California
        district:
          type: string
          description: District or county name. Available on the Security plan.
          examples:
            - Santa Clara County
        city_name:
          type: string
          description: City name.
          examples:
            - Mountain View
        latitude:
          type: number
          description: City latitude. Defaults to the capital city latitude when the city is unknown.
          examples:
            - 37.38605
        longitude:
          type: number
          description: City longitude. Defaults to the capital city longitude when the city is unknown.
          examples:
            - -122.08385
        zip_code:
          type: string
          description: ZIP or postal code.
          examples:
            - '94035'
        time_zone:
          type: string
          description: UTC time zone with daylight saving time applied.
          examples:
            - -07:00
        asn:
          type: string
          description: Autonomous system number (ASN).
          examples:
            - '15169'
        as:
          type: string
          description: Autonomous system (AS) name.
          examples:
            - Google LLC
        as_info:
          $ref: '#/components/schemas/ASInfo'
        isp:
          type: string
          description: Internet Service Provider or company name. Available on the Starter plan and above.
          examples:
            - Google LLC
        domain:
          type: string
          description: Internet domain name associated with the IP address range. Available on the Starter plan and above.
          examples:
            - google.com
        net_speed:
