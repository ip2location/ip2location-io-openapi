openapi: 3.2.1
info:
  title: IP2Location.io Bulk IP Geolocation API
  summary: Bulk IP Geolocation
  description: |-
    IP2Location.io Bulk IP Geolocation API looks up up to 1,000 IPv4 and IPv6 addresses in a single request and returns a record per address.

    **Authentication.** Send your API key as a Bearer token in the `Authorization` header (recommended), or as the `key` query parameter. Without a key, the IP geolocation endpoint allows 1,000 requests per day from the same client IP. This endpoint requires a paid plan.

    **Request body.** Send a newline-separated list of addresses as `text/plain`, or a JSON array of addresses as `application/json`.

    **Response.** With `format=json` the response is an object keyed by address. With `format=csv` it is a CSV table with one row per address and the requested fields as columns. Use `fields` to limit the columns; omitting it returns every field.
  version: '1'
  termsOfService: https://www.ip2location.io/terms-of-service
  contact:
    name: IP2Location.io
    url: https://www.ip2location.io
    email: support@ip2location.io
  license:
    name: MIT
    url: https://github.com/ip2location/ip2location-io-openapi/blob/main/LICENSE
servers:
  - url: https://bulk.ip2location.io
    description: Bulk lookup endpoint.
tags:
  - name: Bulk IP Geolocation
    description: Look up up to 1,000 IP addresses in one request.
paths:
  /:
    post:
      tags:
        - Bulk IP Geolocation
      summary: Geolocate up to 1,000 IP addresses
      description: Looks up a batch of IPv4 and IPv6 addresses and returns one record per address. Send the addresses as newline-separated text or as a JSON array. The endpoint requires a paid plan and accepts at most 1,000 addresses per request.
      operationId: bulkIpGeolocation
      externalDocs:
        description: Bulk API documentation
        url: https://www.ip2location.io/ip2location-bulk-documentation
      parameters:
        - $ref: '#/components/parameters/key_required'
        - $ref: '#/components/parameters/format_json_csv'
        - $ref: '#/components/parameters/fields'
      requestBody:
        required: true
        description: 'IP addresses to look up: newline-separated text or a JSON array.'
        content:
          text/plain:
            schema:
              type: string
              examples:
                - |-
                  1.1.1.1
                  2.2.2.2
            examples:
              Newline-separated:
                value: |-
                  1.1.1.1
                  2.2.2.2
          application/json:
            schema:
              type: array
              items:
                type: string
                format: ip
              examples:
                - - 1.1.1.1
                  - 2.2.2.2
            examples:
              JSON array:
                value:
                  - 1.1.1.1
                  - 2.2.2.2
      responses:
        '200':
          description: One geolocation record per submitted address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIPGeolocationResponse'
              examples:
                JSON response:
                  value:
                    1.1.1.1:
                      country_code: AU
                      country_name: Australia
                      region_name: Queensland
                      district: Brisbane
                      city_name: Brisbane
                      latitude: -27.46754
                      longitude: 153.02809
                      zip_code: '4000'
