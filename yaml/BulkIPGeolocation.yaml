                        translation:
                          lang: en
                          value: Australia
                      region:
                        name: Queensland
                        code: AU-QLD
                        translation:
                          lang: en
                          value: Queensland
                      city:
                        name: Brisbane
                        translation:
                          lang: en
                          value: Brisbane
                      time_zone_info:
                        olson: Australia/Brisbane
                        current_time: '2026-02-24T11:34:09+10:00'
                        gmt_offset: 36000
                        is_dst: false
                        abbreviation: AEST
                        dst_start_date: null
                        dst_end_date: null
                        sunrise: 05:36
                        sunset: '18:26'
                      geotargeting:
                        metro: null
                      is_proxy: false
                      fraud_score: 0
                      proxy:
                        last_seen: 1
